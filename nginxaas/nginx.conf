# Thanks for using NGINXaaS.
# This is the default NGINX config that will work on any NGINXaaS deployment. Use this as a starting
# point to get your NGINXaaS deployment going, and come back to edit later to fit your needs.

http {
    # Upstream NGF or GKE Inference Gateway in cluster
    # TODO(@memes): Declare DNS resolver and use DNS name for upstream to support multi-region
    upstream gw {
        server 172.16.0.5;
    }

    # Reuse TLS certs for all sites
    ssl_certificate /etc/nginx/acceleratedgcp.com.pem;
    ssl_certificate_key /etc/nginx/acceleratedgcp.com.key;
    include /etc/nginx/conf.d/*.conf;

    # If log exporting is configured, NGINXaaS only scrapes logs in /var/log/nginx/,
    # so we recommend keeping these log file paths.
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log error;
}

# Note: Editing these will have no effect as changes will be silently overridden.
# See https://docs.nginx.com/nginxaas/google/getting-started/nginx-configuration/overview/#directives-that-cannot-be-overridden
user nginx;
pid /run/nginx/nginx.pid;
worker_processes auto;
worker_rlimit_nofile 524288;
events {
	worker_connections 150000;
}
