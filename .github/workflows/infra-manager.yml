# Declares an action that triggers Google Cloud Infrastructure Manager tasks on changes in the declared directories.
# The intent is to trigger a Terraform plan on PR creation and changes, and an apply on merge to main.
#
# yamllint disable rule:line-length
---
name: 'Infra Manager'

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
    inputs:
      action:
        description: Infrastructure Manager action to trigger
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
          - delete
          - output
  pull_request:
    paths:
      - 'foundations/**'
      - 'vertex-ai/**'
      - .github/workflows/infra-manager.yml
      - .github/workflows/infra-manager-base.yml
      - .github/workflows/infra-manager-wrapper.sh
    types:
      - opened
      - synchronize
  push:
    branches:
      - main
    paths:
      - 'foundations/**'
      - 'vertex-ai/**'
      - .github/workflows/infra-manager.yml
      - .github/workflows/infra-manager-base.yml
      - .github/workflows/infra-manager-wrapper.sh

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  foundations:
    uses: ./.github/workflows/infra-manager-base.yml
    with:
      action: "${{ case(github.event_name == 'workflow_dispatch', inputs.action || 'plan', '') }}"
      deployment_id: f5-ai-solutions-foundations
      labels: "owner=emes,email=m_dot_emes_at_f5_dot_com"
      project_id: "${{ vars.PROJECT_ID }}"
      region: us-central1
      source_directory: foundations
      tf_vars_content: |-
        # Autogenerated by ${{ github.workflow }} workflow
        project_id = "${{ vars.PROJECT_ID }}"
        name  = "f5-ai-solutions"
        repositories = [
          "${{ vars.OCI_VIRT_REGISTRY }}",
        ]
        labels = {
          owner = "emes"
          email = "m_dot_emes_at_f5_dot_com"
        }
        allowlist_cidrs = ${{ vars.ALLOWLIST_CIDRS || '[]' }}
        dns = {
          base_domain = "${{ vars.DNS_BASE_DOMAIN }}"
          managed_zone_id = "${{ vars.DNS_MANAGED_ZONE_ID }}"
        }
    secrets:
      iac_service_account: ${{ secrets.IAC_SERVICE_ACCOUNT}}
      workload_identity_provider_id: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER_ID }}
  vertex-ai:
    if: false  # TODO(@memes): Disabled for now
    needs: foundations
    uses: ./.github/workflows/infra-manager-base.yml
    with:
      action: "${{ case(github.event_name == 'workflow_dispatch', inputs.action || 'plan', '') }}"
      deployment_id: f5-ai-solutions-vertex-ai
      labels: "owner=emes,email=m_dot_emes_at_f5_dot_com"
      project_id: "${{ vars.PROJECT_ID }}"
      region: us-central1
      source_directory: vertex-ai
      tf_vars_content: |-
        # Autogenerated by ${{ github.workflow }} workflow
        project_id = "${{ vars.PROJECT_ID }}"
        name  = "f5-ai-solutions"
        labels = {
          owner = "emes"
          email = "m_dot_emes_at_f5_dot_com"
        }
        subnets = {
          "us-central1" = "https://www.googleapis.com/compute/v1/projects/${{ vars.PROJECT_ID }}/regions/us-central1/subnetworks/f5-ai-demo-us-ce1"
        }
    secrets:
      iac_service_account: ${{ secrets.IAC_SERVICE_ACCOUNT}}
      workload_identity_provider_id: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER_ID }}
