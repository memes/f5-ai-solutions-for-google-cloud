# Copies publicly accessible containers from Docker Hub and GHCR to the private Artifact Registry
# yamllint disable rule:line-length
# spell-checker: disable
---
name: Container stager

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    paths:
      - 'skopeo.yaml'
      - .github/workflows/container-stager.yml

permissions:
  contents: read
  id-token: write
  packages: read

jobs:
  container-stager:
    runs-on: ubuntu-latest
    if: false  # TODO(@memes): Disabled as some containers too large to reasonably process in an action.
    steps:
      - name: Checkout source
        id: checkout
        uses: actions/checkout@v7
      - name: Install skopeo
        run: |
          sudo sh -c 'apt update && apt install -y skopeo'
      - id: gcp_auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          service_account: ${{ secrets.AR_SERVICE_ACCOUNT }}
          token_format: access_token
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER_ID }}
      - id: skopeo_harbor_auth
        name: Authenticate to F5 AI Harbor repo
        # TODO(@memes): Resolve this later
        run: |
          skopeo login harbor.calypsoai.app --username "" --password ""
      - id: skope_gar_auth
        name: Authenticate to private repo
        run: |
          skopeo login "$(echo "${{ vars.OCI_REGISTRY }}" | cut -d/ -f1)" --username oauth2accesstoken --password "${{ steps.gcp_auth.outputs.access_token }}"
      - name: Copy containers to private repo
        run: |
          skopeo sync --src yaml --dest docker \
            --all --preserve-digests --scoped skopeo.yaml ${{ vars.OCI_REGISTRY }}
