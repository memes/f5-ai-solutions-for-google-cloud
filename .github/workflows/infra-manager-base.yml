# Declares a reusable job that triggers Google Cloud Infrastructure Manager tasks based on the parameters passed in
# by the caller.
#
# yamllint disable rule:line-length
---
# yamllint disable-line rule:truthy
on:
  workflow_call:
    inputs:
      action:
        description: Explicit Infrastructure Manager action to trigger
        required: false
        type: string
      deployment_id:
        description: The Infrastructure Manager deployment identifier; must be <= 40 characters in length
        required: true
        type: string
      labels:
        description: Optional, comma-separated key=value pairs to use as labels
        required: false
        type: string
      project_id:
        description: The GCP project identifier to use with Infrastructure Manager
        required: true
        type: string
      region:
        description: The region to use for Infrastructure Manager
        required: true
        type: string
      source_directory:
        description: The source directory containing Terraform to be executed by Infrastructure Manager
        required: false
        type: string
      tf_vars_content:
        description: Optional content of a tfvars file
        required: false
        type: string
    secrets:
      iac_service_account:
        description: The service account email address to use with Infrastructure Manager
        required: true
      workload_identity_provider_id:
        description: The qualified Workload Identity provider identifier
        required: true

jobs:
  infra-manager:
    runs-on: ubuntu-latest
    env:
      # These values define the properties used by Infrastructure Manager
      # NOTE: DEPLOYMENT_ID must be less than 40 chars or Infra Manager will throw an error
      DEPLOYMENT_ID: ${{ inputs.deployment_id }}
      DEPLOYMENT_PROJECT_ID: ${{ inputs.project_id }}
      DEPLOYMENT_REGION: ${{ inputs.region }}
      DEPLOYMENT_TF_VERSION: "1.5.7"
      DEPLOYMENT_SERVICE_ACCOUNT_NAME: "projects/${{ inputs.project_id }}/serviceAccounts/${{ secrets.iac_service_account }}"
      DEPLOYMENT_LABELS: "${{ inputs.labels }}"
      DEPLOYMENT_GIT_URL: "${{ github.server_url }}/${{ github.repository }}"
      DEPLOYMENT_GIT_SHA: "${{ github.sha }}"
      DEPLOYMENT_GIT_REF: "${{ github.head_ref || github.ref_name }}"
      DEPLOYMENT_GIT_SOURCE_DIRECTORY: "${{ inputs.source_directory }}"
      DEPLOYMENT_RUN_ID: "${{ github.run_id }}"
      DEPLOYMENT_INPUTS_FILE: "infra-manager-state/${{ github.sha }}.tfvars"
    steps:
      - name: Checkout source
        id: checkout
        uses: actions/checkout@v7
      - name: Get Infra Manager action steps
        id: get_im_action_steps
        uses: actions/github-script@v9
        with:
          script: |
            const explicitAction = '${{ inputs.action }}';
            const exec_plan = explicitAction == 'plan' || context.eventName == 'pull_request';
            const exec_apply = explicitAction == 'apply' || context.eventName == 'push';
            const exec_delete = explicitAction == 'delete';
            const exec_output = explicitAction == 'output' || exec_apply;
            core.setOutput('exec_plan', exec_plan);
            core.setOutput('exec_apply', exec_apply);
            core.setOutput('exec_delete', exec_delete);
            core.setOutput('exec_output', exec_output);
      - name: Install Terraform binary
        id: install-terraform
        uses: hashicorp/setup-terraform@v4
        if: ${{ fromJson(steps.get_im_action_steps.outputs.exec_output) }}
        with:
          terraform_version: "${{ env.DEPLOYMENT_TF_VERSION}}"
      - name: Google Authentication
        id: google-auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ inputs.project_id }}
          workload_identity_provider: ${{ secrets.workload_identity_provider_id }}
      - name: Google Cloud CLI
        id: gcloud-cli
        uses: google-github-actions/setup-gcloud@v3
      - name: Create local terraform variables file
        id: create-tf-vars-file
        # if: ${{ success() && fromJson(steps.get_im_action_steps.outputs.exec_plan) || fromJson(steps.get_im_action_steps.outputs.exec_apply) }}
        # NOTE: This file defines the inputs for the Terraform executed by Infrastructure Manager. It mostly consists
        # of substitutions from root and job environment, but other values can be added too (e.g. labels), or can be
        # removed if not used (e.g. NGINX JWT secret identifier).
        # NOTE 2: An alternative is to disable/remove this step and rely on `terraform.tfvars` or `*.auto.tfvars` that
        # has been committed to the repo.
        run: |
          mkdir -p "$(dirname "${{ env.DEPLOYMENT_INPUTS_FILE }}")"
          cat <<'EOF' > "${{ env.DEPLOYMENT_INPUTS_FILE }}"
          ${{ inputs.tf_vars_content }}
          EOF
      - name: Generate preview plan
        id: generate-tf-plan
        if: ${{ success() && fromJson(steps.get_im_action_steps.outputs.exec_plan) }}
        run: ./.github/workflows/infra-manager-wrapper.sh plan
      - name: Apply changes
        id: apply-tf
        if: ${{ success() && fromJson(steps.get_im_action_steps.outputs.exec_apply) }}
        run: ./.github/workflows/infra-manager-wrapper.sh apply
      - name: Delete deployment
        id: delete-tf
        if: ${{ success() && fromJson(steps.get_im_action_steps.outputs.exec_delete) }}
        run: ./.github/workflows/infra-manager-wrapper.sh delete
      - name: Generate a markdown output summary
        id: generate-tf-output
        if: ${{ success() && fromJson(steps.get_im_action_steps.outputs.exec_output) }}
        run: ./.github/workflows/infra-manager-wrapper.sh output
      - name: Store any infra-manager generated artifacts
        uses: actions/upload-artifact@v7
        with:
          name: infra-manager-state
          path: infra-manager-state/
          if-no-files-found: warn
          retention-days: 1
  update-pr:
    runs-on: ubuntu-latest
    needs: infra-manager
    steps:
      - name: Checkout source
        id: checkout
        uses: actions/checkout@v7
      - name: Restore infra-manager artifacts
        uses: actions/download-artifact@v8
        with:
          name: infra-manager-state
          path: infra-manager-state/
      - name: Get PR number
        id: get_pr_number
        uses: actions/github-script@v9
        with:
          result-encoding: string
          script: |
            if (context.issue.number) {
              return context.issue.number;
            } else {
              data = (
                await github.rest.repos.listPullRequestsAssociatedWithCommit({
                  commit_sha: context.sha,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                })
              ).data;
              return data.length > 0 ? data[0].number : undefined;
            }
      - name: Generate markdown summary of plan for PR
        id: generate-md-from-plan
        run: |
          [ ! -f "infra-manager-state/${{ github.sha }}.json" ] || docker run -v $(pwd)/infra-manager-state/${{ github.sha }}.json:/data/plan.json:ro oocx/tfplan2md /data/plan.json --render-target github --report-title "${{ github.workflow }} (${{ inputs.source_directory || 'root' }}): Proposed Changes" > "infra-manager-state/${{ github.sha }}.plan.md"
      - name: Write terraform plan to PR or stdout
        id: tf-plan
        uses: actions/github-script@v9
        env:
          ISSUE_NUMBER: ${{ steps.get_pr_number.outputs.result }}
        with:
          script: |
            const fs = require('fs');
            const planFile = 'infra-manager-state/${{ github.sha }}.plan.md';
            if (fs.existsSync(planFile)) {
              const plan = fs.readFileSync(planFile, 'utf8');
              const pr = parseInt(process.env.ISSUE_NUMBER);
              if (isNaN(pr)) {
                process.stdout.write(plan);
              } else {
                github.rest.issues.createComment({
                  issue_number: pr,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: plan,
                });
              }
            }
      - name: Add terraform output to PR or stdout
        id: tf-output
        uses: actions/github-script@v9
        env:
          ISSUE_NUMBER: ${{ steps.get_pr_number.outputs.result }}
        with:
          script: |
            const fs = require('fs');
            const outputFile = 'infra-manager-state/${{ github.sha }}.output.hcl';
            if (fs.existsSync(outputFile)) {
              const output = fs.readFileSync(outputFile, 'utf8');
              const pr = parseInt(process.env.ISSUE_NUMBER);
              if (isNaN(pr)) {
                process.stdout.write(output);
              } else {
                const title = '## ${{ github.workflow }} (${{ inputs.source_directory || "root" }}): output values';
                github.rest.issues.createComment({
                  issue_number: pr,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: title + '\n\n```hcl\n' + output + '\n```\n',
                });
              }
            }
